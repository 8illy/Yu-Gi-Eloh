<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Yu-Gi-Eloh!</title><link rel=icon href="favicon.ico"><link rel=stylesheet href=style.css></head><body class=nosel>
<header><a href="#/"><img class=logo src="logo.png" alt="Yu-Gi-Eloh!"></a><nav><a href="#/">Leaderboard</a><a href="#/events">Events</a><a href="#/winners">Format Winners</a></nav></header>
<main id=app>Loading…</main>
<script src=lib.js?v=2></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let D,S,SA,PER,PV;
// "Custom" format: the person picks a start and end date
const CUS={start:'',end:''};
const customDefaults=()=>{const ds=D.events.map(e=>e.date).sort();return{start:ds[0]||'',end:ds.at(-1)||''}};
const customPer=()=>({name:'Custom',start:CUS.start||customDefaults().start,end:CUS.end});
const calc=()=>{const per=PER==='all'?null:PER==='custom'?customPer():periodList(D).find(p=>p.start===PER);S=derive(D,per);
 // snapshot before the most recent event in this view, to show rank / Elo changes
 const last=S.events.at(-1);PV=last&&S.events.length>1&&!(per&&per.end&&per.end<new Date().toISOString().slice(0,10))?derive({...D,events:D.events.filter(e=>e.id!==last.id)},per):null};
// highest rating reached in this view (the starting rating counts)
const peak=(q,X)=>{let m=CFG.start;X.matches.forEach(x=>{const r=x.p1===q.id?x.r1:x.p2===q.id?x.r2:null;if(r!=null&&r>m)m=r});return Math.round(m)};
const dchip=v=>{if(v==null)return'';const r=Math.round(v);return` <small class=${r>0?'up':r<0?'dn':'zero'}>${r>=0?'+':''}${r}</small>`};
// Elo on an event page = the ranking period the event belongs to (none if it is outside every period)
const dc={};
const dvFor=e=>{const has=periodList(D).length,p=has?periodFor(D,e.date):null;if(has&&!p)return null;return dc[p?p.start:'all']??=derive(D,p)};
const chg=(d,txt)=>d?` <small class=${d>0?'up':'dn'}>${txt}</small>`:'';
const dRank=(id,i)=>{if(!PV)return'';const j=PV.list.findIndex(x=>x.id===id);return j<0?' <small class=up>new</small>':chg(j-i,(j>i?'▲':'▼')+Math.abs(j-i))};
const dElo=p=>{if(!PV)return'';const q=PV.P[p.id];if(!q||!PV.list.includes(q))return'';const d=Math.round(p.elo-q.elo);return chg(d,(d>0?'+':'')+d)};
const sel=()=>`<div class=row style="justify-content:flex-end">${PER==='custom'?`<label>From <input type=date id=cs value="${CUS.start}" max="${CUS.end}"></label><label>to <input type=date id=ce value="${CUS.end}" min="${CUS.start}"></label>`:''}<label>Format <select id=per><option value=all${PER==='all'?' selected':''}>All time</option>${periodList(D).map(p=>`<option value="${esc(p.start)}"${PER===p.start?' selected':''}>${esc(periodLabel(p))}</option>`).join('')}<option value=custom${PER==='custom'?' selected':''}>Custom</option></select></label></div>`;
const av=u=>`<img class=av src="${esc(CFG.avatar(u.avatar))}" alt="" onerror="this.style.visibility='hidden'">`;
const pl=id=>{const p=S.P[id];return p?(p.guest?`<span class=pl>${av(p)}<span class=nm>${esc(p.name)}</span></span>`:`<a class=pl href="#/player/${id}">${av(p)}<span class=nm>${esc(p.name)}</span></a>`):'?'};
const plr=id=>{const p=S.P[id];return p?(p.guest?`<span class="pl pr"><span class=nm>${esc(p.name)}</span>${av(p).replace('class=av','class="av after"')}</span>`:`<a class="pl pr" href="#/player/${id}"><span class=nm>${esc(p.name)}</span>${av(p).replace('class=av','class="av after"')}</a>`):'?'};
// A bye is shown as a normal-looking player (not a link) so layouts stay the same
const byep=after=>{const i=av({avatar:CFG.byeAvatar});return after?`<span class="pl pr"><span class=nm>Bye</span>${i.replace('class=av','class="av after"')}</span>`:`<span class=pl>${i}<span class=nm>Bye</span></span>`};
// wins include byes; the tooltips break the numbers down
const wl=p=>`<span title="Wins: ${p.w}, byes: ${p.byes}">${p.w+p.byes}</span>–<span title="Losses: ${p.l}, double losses: ${p.dl}">${p.l+p.dl}</span>`;
const wr=p=>pct(p.w+p.byes,tot(p)+p.byes);
const pct=(w,t)=>t?Math.round(100*w/t)+'%':'–';
const evl=e=>`<a href="#/event/${esc(e.id)}">${esc(evName(e))}</a>`;
const tbl=(h,rows,l=1)=>`<table><tr>${h.map((x,i)=>`<th${i<l?'':' class=r'}>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td${i<l?'':' class=r'}>${x}</td>`).join('')}</tr>`).join('')}</table>`;
const tot=h=>h.w+h.l+h.dl;

// Leaderboard header: period name, dates (no end date = ongoing; "all time" starts at the first event) and totals
const curPer=()=>PER==='all'?null:PER==='custom'?customPer():periodList(D).find(p=>p.start===PER);
const hdr=()=>{const p=curPer(),first=D.events.reduce((a,e)=>!a||e.date<a?e.date:a,null),start=p?p.start:first,
 st=(v,k)=>`<div><b>${v}</b><small>${k}</small></div>`;
 return `<div class=card><h2>${esc(p?periodLabel(p):'All time')}</h2><div class=stats><span class=g>${start?st(fmtDate(start),'start'):''}${p&&p.end?st(fmtDate(p.end),'end'):''}</span><span class=g>${st(S.events.length,'events')}${st(S.matches.filter(m=>m.result!=='bye').length,'matches')}${st(S.list.length,'players')}</span></div></div>`};
const board=()=>sel()+hdr()+`<div class="card lb">${tbl(['#','Player','Elo','W–L','Win %','1st places','Events'],S.list.map((p,i)=>[`${i+1}${dRank(p.id,i)}`,pl(p.id),`${Math.round(p.elo)}${dElo(p)}`,wl(p),wr(p),p.firsts,p.events]),2)}</div>`;

// Trophies: all-time achievements, independent of the selected period
let PT=[],EP=[];
const pname=p=>p.name||new Date(p.end+'T12:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
function calcPT(){EP=periodList(D).length?periodList(D).map(p=>derive(D,p).matches):[SA.matches];const today=new Date().toISOString().slice(0,10);
 PT=periodList(D).filter(p=>p.end&&p.end<today).map(p=>{const L=derive(D,p).list,mx=Math.max(0,...L.map(x=>x.firsts)),mm=Math.max(0,...L.map(x=>x.w));
  return{p,rk:Object.fromEntries(L.map(x=>[x.id,1+L.filter(y=>Math.round(y.elo)>Math.round(x.elo)).length])),win:mx?L.filter(x=>x.firsts===mx).map(x=>x.id):[],winm:mm?L.filter(x=>x.w===mm).map(x=>x.id):[]}})}
function trophies(id){if(!D.trophies)return[];const T=[],tier=(i,n)=>i<n/3?'bronze':i<2*n/3?'silver':'gold';
 PT.forEach(({p,rk,win,winm})=>{const r=rk[id],nm=pname(p);
  if(r<=3)T.push({d:p.end,k:'rank',tier:['gold','silver','bronze'][r-1],g:'#'+r,t:`#${r} ${nm}`});
  if(win.includes(id))T.push({d:p.end,k:'most',tier:'gold',g:'#1',t:`Most event wins ${nm}`});
  if(winm.includes(id))T.push({d:p.end,k:'mostmatch',tier:'gold',g:'#1',t:`Most match wins ${nm}`})});
 const ms=(thr,dates,label)=>{let k=-1;thr.forEach((n,i)=>{if(dates.length>=n)k=i});
  if(k>=0)T.push({d:dates[thr[k]-1],k:label[0]=='M'?'match':'event',tier:tier(k,thr.length),g:String(thr[k]),t:`${label} [${thr[k]}]`})};
 ms(D.trophies.matchWinMilestones,SA.matches.filter(m=>(m.result==='p1'&&m.p1===id)||(m.result==='p2'&&m.p2===id)).map(m=>m.date),'Match wins');
 ms(D.trophies.eventWinMilestones,SA.events.filter(e=>e.standings.some(s=>s.p===id&&s.r===1)).map(e=>e.date),'Event wins');
 // beat a specific player (ids and face images come from config.json -> trophies.beatMedals)
 (D.trophies.beatMedals||[]).forEach(b=>{const bp=String(b.player);if(bp===id)return;
  const w=SA.matches.find(m=>(m.result==='p1'&&m.p1===id&&m.p2===bp)||(m.result==='p2'&&m.p2===id&&m.p1===bp));
  if(w)T.push({d:w.date,k:'beat',tier:'gold',g:b.image,t:`Beat ${SA.P[bp]?SA.P[bp].name:'#'+bp}`})});
 const th=D.trophies.eloMilestones||[];
 if(th.length){let best=-1,bd='';
  EP.forEach(L=>{let k=-1,d='';
   L.forEach(m=>{const r=m.p1===id?m.r1:m.p2===id?m.r2:null;if(r==null)return;th.forEach((n,i)=>{if(Math.round(r)>=n&&i>k){k=i;d=m.date}})});
   if(k>best||(k===best&&k>=0&&d<bd)){best=k;bd=d}});
  if(best>=0)T.push({d:bd,k:'elo',tier:tier(best,th.length),g:String(th[best]),t:`Reached ${th[best]} Elo`})}
 return T.sort((a,b)=>b.d.localeCompare(a.d))}
// kinds: rank = laurel wreath, most = shield + star, match = fanned cards, event = trophy cup
function medal(k,tier,g){const c=D.trophies.medalColors[tier],l=c.highlight,m=c.base,d=c.shadow,t=c.ink,rb=D.trophies.ribbonColors[k]||{left:'#8a94a6',right:'#5f6878'},r1=rb.left,r2=rb.right,id='g'+tier,
 grad=(n,a,b)=>`<linearGradient id="${id}${n}" x1=${a} y1=${a} x2=${b} y2=${b}><stop offset=0 stop-color="${l}" /><stop offset=.5 stop-color="${m}" /><stop offset=1 stop-color="${d}" /></linearGradient>`,
 fo=`fill="url(#${id})" stroke="${d}" stroke-width=1.5`,fi=`fill="url(#${id}r)" stroke="${d}" stroke-width=1`,
 P={most:['M50 42L88 53V88C88 111 70 123 50 131 30 123 12 111 12 88V53Z','M50 50L81 59V88C81 106 66 116 50 123 34 116 19 106 19 88V59Z'],event:['M50 41L88 63V107L50 129 12 107V63Z','M50 49L81 67V103L50 121 19 103V67Z']}[k],
 oct=r=>[...Array(8)].map((_,i)=>{const a=(i*45+22.5)*Math.PI/180;return(50+r*Math.cos(a)).toFixed(1)+','+(86+r*Math.sin(a)).toFixed(1)}).join(' '),
 seal=[...Array(32)].map((_,i)=>{const a=i*Math.PI/16,r=i%2?39:45;return(50+r*Math.cos(a)).toFixed(1)+','+(86+r*Math.sin(a)).toFixed(1)}).join(' '),
 body=k=='beat'?`<circle cx=50 cy=86 r=44 ${fo} /><circle cx=50 cy=86 r=34 fill="${d}" /><clipPath id=bclip><circle cx=50 cy=86 r=31 /></clipPath><image href="${esc(g)}" x=19 y=55 width=62 height=62 preserveAspectRatio="xMidYMid slice" clip-path="url(#bclip)" />`:k=='elo'?`<polygon points="${oct(46)}" ${fo} stroke-linejoin=round /><polygon points="${oct(37)}" ${fi} />`:k=='mostmatch'?`<polygon points="${seal}" ${fo} stroke-linejoin=round /><circle cx=50 cy=86 r=31 ${fi} />`:P?`<path d="${P[0]}" ${fo} /><path d="${P[1]}" ${fi} />`:`<circle cx=50 cy=86 r=44 ${fo} /><circle cx=50 cy=86 r=38.5 fill=none stroke="${d}" stroke-width=3 stroke-dasharray="2 3.6" opacity=.7 /><circle cx=50 cy=86 r=32 ${fi} />`,
 txt=(y,sz,c,v)=>`<text x=50 y=${y} text-anchor=middle font-family="Georgia,serif" font-weight=700 font-size=${sz} fill="${c}">${v}</text>`,
 plate=`<rect x=27 y=104 width=46 height=18 rx=5 fill="${d}" stroke="${l}" stroke-width=1.5 />`+txt(117,g.length>3?10:13,l,g),
 card=a=>`<g transform="rotate(${a} 50 100)"><rect x=40 y=66 width=20 height=28 rx=3 fill="${l}" stroke="${t}" stroke-width=2 /><ellipse cx=50 cy=78 rx=5 ry=6.5 fill="${t}" opacity=.55 /></g>`,
 leaf=(f,sg)=>{const x=(50+sg*27*Math.sin(f*Math.PI/180)).toFixed(1),y=(86-27*Math.cos(f*Math.PI/180)).toFixed(1);return`<ellipse cx=${x} cy=${y} rx=6.5 ry=2.8 fill="${t}" opacity=.8 transform="rotate(${sg*f} ${x} ${y})" />`},
 star=[...Array(10)].map((_,i)=>{const a=i*Math.PI/5-Math.PI/2,r=i%2?9:21;return(50+r*Math.cos(a)).toFixed(1)+','+(82+r*Math.sin(a)).toFixed(1)}).join(' '),
 icon={rank:[0,1,2,3,4,5].map(i=>leaf(32+i*27,-1)+leaf(32+i*27,1)).join('')+txt(96,g.length>2?22:30,t,g),
  most:`<polygon points="${star}" fill="${t}" />`+plate,
  beat:'',
  elo:`<polyline points="30,98 44,82 54,90 70,66" fill=none stroke="${t}" stroke-width=5 stroke-linecap=round stroke-linejoin=round /><polygon points="77,55 75.8,69.9 64.2,62.1" fill="${t}" />`+plate,
  mostmatch:`<g stroke="${t}" stroke-linecap=round fill=none><path d="M36 64L64 98M64 64L36 98" stroke-width=5 /><path d="M51.6 94.5L62.4 85.5M48.4 94.5L37.6 85.5" stroke-width=4 /></g><circle cx=64 cy=98 r=3.5 fill="${t}" /><circle cx=36 cy=98 r=3.5 fill="${t}" />`+plate,
  match:card(-24)+card(0)+card(24)+plate,
  event:`<path d="M37 60h26v12c0 9-5.5 15-13 15s-13-6-13-15z" fill="${t}" /><path d="M37 64c-8 0-9 10 0 12M63 64c8 0 9 10 0 12" fill=none stroke="${t}" stroke-width=3 /><rect x=47 y=87 width=6 height=7 fill="${t}" /><rect x=40 y=94 width=20 height=5 rx=2 fill="${t}" />`+plate}[k];
 return `<svg viewBox="0 0 100 134" width=100 height=134 aria-hidden=true><defs>${grad('',0,1)}${grad('r',1,0)}</defs><path d="M27 0h18l11 52H38z" fill="${r1}" /><path d="M73 0H55L44 52h18z" fill="${r2}" /><path d="M33 0l10 52M67 0L57 52" stroke="#fff" stroke-opacity=.35 stroke-width=2 fill=none />${body}${icon}<ellipse cx=36 cy=62 rx=15 ry=7 fill="#fff" opacity=.2 transform="rotate(-30 36 62)" /></svg>`}
const trophyCard=id=>{const T=trophies(id);return T.length?`<details class=card open><summary>Trophies</summary><div class=tro>${T.map(t=>`<div class=trophy>${medal(t.k,t.tier,t.g)}<div class=tname>${esc(t.t)}</div><div class=tdate>${fmtDate(t.d)}</div></div>`).join('')}</div></details>`:''};

function player(id){const p=S.P[id];if(!p)return'Unknown player';
 const st=(v,k)=>`<div><b>${v}</b><small>${k}</small></div>`;
 const card=(q,X,all)=>`<div class="card stats"><div class=lft><span class=big>${Math.round(q.elo)}</span><small>${X.list.includes(q)?`${all?'All-time Elo':'Elo'}, rank ${X.list.indexOf(q)+1} of ${X.list.length}`:all?'No events yet':'No events in this period'}</small></div>${X.list.includes(q)?`<div title="Highest Elo reached"><b>${peak(q,X)}</b><small>highest Elo</small></div>`:''}${st(wl(q),'wins–losses')}${st(q.dl,'double losses')}${st(q.byes,'byes')}${st(wr(q),'win rate')}${st(q.firsts,'1st places')}${st(q.events,'events')}</div>`;
 const h2h=Object.entries(p.h2h).sort((a,b)=>S.P[a[0]].name.localeCompare(S.P[b[0]].name)).map(([o,h])=>({v:[S.P[o].name,h.w,h.l+h.dl,tot(h)?h.w/tot(h):0],c:[pl(o),h.w,`<span title="Losses: ${h.l}, double losses: ${h.dl}">${h.l+h.dl}</span>`,pct(h.w,tot(h))]}));
 const em=Object.fromEntries(D.events.map(e=>[e.id,e])),
  hist=S.matches.map((m,ix)=>({m,ix})).filter(({m})=>m.p1===id||m.p2===id).reverse().map(({m,ix})=>{const o=m.p1===id?m.p2:m.p1,r=m.result;
   return{v:[ix,o==null?'Bye':S.P[o].name,r==='bye'?3:r==='dl'?2:(r==='p1')===(m.p1===id)?0:1,evName(em[m.event])],c:[fmtDate(m.date),o==null?byep():pl(o),(r==='bye'?'Bye':r==='dl'?'<span class=dn>Double loss</span>':(r==='p1')===(m.p1===id)?'<span class=win>Win</span>':'<span class=dn>Loss</span>')+dchip(m.p1===id?m.d1:m.d2),`${evl(em[m.event])} <small>round ${m.round}</small>`]}});
 const ed={};S.matches.forEach(m=>{if(m.p1===id&&m.d1!=null)ed[m.event]=(ed[m.event]||0)+m.d1;if(m.p2===id&&m.d2!=null)ed[m.event]=(ed[m.event]||0)+m.d2});
 const evs=S.events.filter(e=>e.standings.some(s=>s.p==id)).reverse().map(e=>{const s=e.standings.find(s=>s.p==id);return{v:[Date.parse(e.date),evName(e),s.r,S.pts[e.id][id],ed[e.id]||0],c:[fmtDate(e.date),evl(e),s.r,S.pts[e.id][id],dchip(ed[e.id])||'–']}});
 return sel()+`<div class=hero>${av(p)}<div class=who><h2><span>${esc(p.name)}</span></h2><div class=panels>${PER==='all'?'':card(p,S,0)}${card(SA.P[id],SA,1)}</div></div></div>
 ${trophyCard(id)}<details class="card h2h"><summary>Head to head</summary>${dt('ph:'+id,[{t:'Opponent'},{t:'W',a:'r'},{t:'L',a:'r'},{t:'Win %',a:'r'}],h2h,{size:10,sort:0,dir:1})}</details>
 <details class=card><summary>Events</summary>${dt('pe:'+id,[{t:'Date'},{t:'Event'},{t:'Place',a:'r'},{t:'Pts',a:'r'},{t:'Elo',a:'r'}],evs,{size:10})}</details>
 <details class="card mh"><summary>Match History</summary>${dt('pm:'+id,[{t:'Date'},{t:'Opponent'},{t:'Result'},{t:'Event'}],hist,{size:20})}</details>`}

const events=()=>`<div class=card>${dt('events',[{t:'Date'},{t:'Event'},{t:'Players',a:'r'},{t:'Winner',a:'r'}],[...D.events].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>{const w=e.standings.find(s=>s.r===1),wn=w&&S.P[w.p]?S.P[w.p].name:'';return{v:[Date.parse(e.date),evName(e),e.standings.length,wn],c:[fmtDate(e.date),evl(e),e.standings.length,w?plr(w.p):'']}}),{size:25})}</div>`;

const mr=(m,o)=>m.result==='bye'?`<span class="l win"><span class=w>${pl(m.p1)}</span></span><span>vs</span><span class=r>${byep(true)}</span>`:`<span class="l ${m.result=='p1'?'win':''}"><span class=w>${pl(m.p1)}${dchip(o&&o.d1)}</span></span><span>vs</span><span class="r ${m.result=='p2'?'win':''}"><span class="w rv">${plr(m.p2)}${dchip(o&&o.d2)}</span></span>${m.result=='dl'?'<i>double loss</i>':''}`;
function event(id){const e=D.events.find(e=>e.id===id);if(!e)return'Unknown event';
 const dv=dvFor(e),ed={};
 if(dv)dv.matches.filter(m=>m.event===e.id).forEach(m=>{if(m.d1!=null)ed[m.p1]=(ed[m.p1]||0)+m.d1;if(m.d2!=null)ed[m.p2]=(ed[m.p2]||0)+m.d2});
 const st=(v,k)=>`<div><b>${v}</b><small>${k}</small></div>`;
 return `<div class=card><h2>${esc(evName(e))}${e.rated===false?'<small>unrated</small>':''}</h2><div class=stats>${st(e.standings.length,'players')}${st(e.rounds.length,'rounds')}${st(fmtDate(e.date),'date')}${st(periodFor(D,e.date)?periodLabel(periodFor(D,e.date)):'None','format')}</div></div><div class=card><h3>Final standings</h3>${tbl(['#','Player','Pts','Elo'],[...e.standings].sort((a,b)=>a.r-b.r).map(s=>[s.r,pl(s.p),SA.pts[e.id][s.p],dv?dchip(ed[s.p])||'–':'']),2)}</div>`+
 e.rounds.map((rd,i)=>`<details class=card><summary>Round ${i+1} <small>${esc(rd.phase||'')}</small></summary>${rd.matches.map((m,j)=>`<div class=m>${mr(m,dv&&dv.mx[`${e.id}:${i}:${j}`])}</div>`).join('')}</details>`).join('')}

// Format Winners: the #1 player of every finished format (players level on the same rounded Elo share it)
// Searchable, sortable, paged table. Rows are {c:[cell html...], v:[sort values...]}. State (search / sort / page) is kept in TS.
const TB={},TS={},strip=h=>String(h).replace(/<[^>]*>/g,'');
function dt(id,cols,rows,o={}){
 rows.forEach((r,i)=>{r.i=i;r.s=r.c.map(strip).join(' ').toLowerCase()});
 TB[id]={cols,rows};TS[id]??={q:'',page:0,size:o.size||25,sort:o.sort??0,dir:o.dir??-1};
 return `<div class=dt data-t="${esc(id)}"><input class=dtq type=search autocomplete=off placeholder="Search…" aria-label=Search value="${esc(TS[id].q)}"><div class=dtb></div></div>`}
function dtDraw(id){const{cols,rows}=TB[id],st=TS[id],el=$(`.dt[data-t="${id}"] .dtb`);if(!el)return;
 const toks=st.q.toLowerCase().split(/\s+/).filter(Boolean);
 const list=rows.filter(r=>toks.every(t=>r.s.includes(t))).sort((a,b)=>{const x=a.v[st.sort],y=b.v[st.sort],
  c=typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),undefined,{numeric:true,sensitivity:'base'});return c?c*st.dir:a.i-b.i});
 const pages=Math.max(1,Math.ceil(list.length/st.size));st.page=Math.min(Math.max(st.page,0),pages-1);
 const show=list.slice(st.page*st.size,(st.page+1)*st.size),sizes=[...new Set([10,25,50,100,st.size])].sort((a,b)=>a-b);
 const so=`<select class=dtso aria-label="Sort by">${cols.flatMap((c,j)=>[1,-1].map(d=>`<option value="${j}:${d}"${st.sort===j&&st.dir===d?' selected':''}>${c.t} ${d>0?'▲':'▼'}</option>`)).join('')}</select>`;
 el.innerHTML=so+`<table><tr>${cols.map((c,j)=>`<th class="sortable${c.a==='r'?' r':''}" data-s=${j}>${c.t}${st.sort===j?(st.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr>`+
  (show.map(r=>`<tr>${r.c.map((x,j)=>`<td${cols[j].a==='r'?' class=r':''}>${x}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${cols.length}>Nothing matches your search.</td></tr>`)+`</table>`+
  `<div class=pager><span>${list.length} result${list.length==1?'':'s'}</span><span class=pg>`+
  `<button data-p=prev${st.page?'':' disabled'}>‹ Prev</button>Page ${st.page+1} of ${pages}<button data-p=next${st.page<pages-1?'':' disabled'}>Next ›</button>`+
  `<select class=dts aria-label="Rows per page">${sizes.map(n=>`<option${n==st.size?' selected':''}>${n}</option>`).join('')}</select></span></div>`}
const winners=()=>{const today=new Date().toISOString().slice(0,10),done=periodList(D).filter(p=>p.end&&p.end<today);
 const cards=done.flatMap(p=>{const L=(dc[p.start]??=derive(D,p)).list;if(!L.length)return[];const top=Math.round(L[0].elo);
  return L.filter(x=>Math.round(x.elo)===top).map(x=>`<a class=wcard href="#/player/${x.id}"><span class=wframe>${av(x)}</span><span class=wplate><small>${esc(periodLabel(p))} winner</small><b>${esc(x.name)}</b><span class=welo>Elo ${top}</span></span></a>`)});
 return `<h2>Format Winners</h2>`+(cards.length?`<div class=wgrid>${cards.join('')}</div>`:'<div class=card>No formats have finished yet.</div>')};
function view(){const[,pg,id]=location.hash.split('/');
 $('#app').innerHTML=(CONFIG_ERROR?`<div class="card err">${esc(CONFIG_ERROR)}</div>`:'')+(pg==='player'?player(id):pg==='event'?event(decodeURIComponent(id)):pg==='events'?events():pg==='winners'?winners():board());document.querySelectorAll('.dt').forEach(el=>dtDraw(el.dataset.t));scrollTo(0,0)}
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());
loadData().then(d=>{D=d;SA=derive(d);calcPT();const ps=periodList(d);PER=ps.length?ps[0].start:'all';calc();view()}).catch(e=>$('#app').textContent='Could not load '+DATA_URL+' ('+e.message+'). Serve the folder over HTTP rather than opening the file directly.');
addEventListener('hashchange',()=>D&&view());
// table controls (delegated): search box, column headers, paging, rows per page, mobile sort menu
const dtOf=el=>{const w=el.closest&&el.closest('.dt');return w&&w.dataset.t};
document.addEventListener('input',e=>{if(!e.target.classList.contains('dtq'))return;const id=dtOf(e.target);TS[id].q=e.target.value;TS[id].page=0;dtDraw(id)});
document.addEventListener('click',e=>{const t=e.target,id=dtOf(t);if(!id)return;const st=TS[id];
 if(t.dataset.s!=null){const j=+t.dataset.s;if(st.sort===j)st.dir=-st.dir;else{st.sort=j;st.dir=TB[id].cols[j].a==='r'?-1:1}st.page=0;dtDraw(id)}
 else if(t.dataset.p){st.page+=t.dataset.p==='next'?1:-1;dtDraw(id)}});
document.addEventListener('change',e=>{const t=e.target,id=dtOf(t);if(!id)return;const st=TS[id];
 if(t.classList.contains('dts')){st.size=+t.value;st.page=0;dtDraw(id)}
 else if(t.classList.contains('dtso')){const[j,d]=t.value.split(':');st.sort=+j;st.dir=+d;st.page=0;dtDraw(id)}});
document.addEventListener('change',e=>{if(['per','cs','ce'].includes(e.target.id)){const o=[...document.querySelectorAll('#app details')].map(d=>d.open);{const t=e.target;if(t.id==='per'){PER=t.value;if(PER==='custom'&&!CUS.start)Object.assign(CUS,customDefaults())}else CUS[t.id==='cs'?'start':'end']=t.value}Object.keys(TS).forEach(k=>delete TS[k]);calc();view();document.querySelectorAll('#app details').forEach((d,i)=>d.open=!!o[i])}});
</script></body></html>
