<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Locals rankings</title><link rel=stylesheet href=style.css></head><body>
<header><a href="#/"><img class=logo src="logo.png" alt="Locals rankings"></a><nav><a href="#/">Leaderboard</a><a href="#/events">Events</a></nav></header>
<main id=app>Loading…</main>
<script src=lib.js?v=2></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let D,S,SA,PER;
const calc=()=>{S=derive(D,PER==='all'?null:periodList(D).find(p=>p.start===PER))};
const sel=()=>`<div class=row style="justify-content:flex-end"><label>Ranking period <select id=per><option value=all${PER==='all'?' selected':''}>All time</option>${periodList(D).map(p=>`<option value="${esc(p.start)}"${PER===p.start?' selected':''}>${esc(periodLabel(p))}</option>`).join('')}</select></label></div>`;
const av=u=>`<img class=av src="${esc(CFG.avatar(u.avatar))}" alt="" onerror="this.style.visibility='hidden'">`;
const pl=id=>{const p=S.P[id];return p?`<a class=pl href="#/player/${id}">${av(p)}${esc(p.name)}</a>`:'?'};
const plr=id=>{const p=S.P[id];return p?`<a class="pl pr" href="#/player/${id}">${esc(p.name)}${av(p).replace('class=av','class="av after"')}</a>`:'?'};
// A bye is shown as a normal-looking player (not a link) so layouts stay the same
const byep=after=>{const i=av({avatar:'39526584'});return after?`<span class="pl pr">Bye${i.replace('class=av','class="av after"')}</span>`:`<span class=pl>${i}Bye</span>`};
const wl=p=>`<span title="Losses: ${p.l}, double losses: ${p.dl}">${p.w}–${p.l+p.dl}</span>`;
const pct=(w,t)=>t?Math.round(100*w/t)+'%':'–';
const evl=e=>`<a href="#/event/${esc(e.id)}">${esc(evName(e))}</a>`;
const tbl=(h,rows,l=1)=>`<table><tr>${h.map((x,i)=>`<th${i<l?'':' class=r'}>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td${i<l?'':' class=r'}>${x}</td>`).join('')}</tr>`).join('')}</table>`;
const tot=h=>h.w+h.l+h.dl;

const board=()=>sel()+`<div class="card lb">${tbl(['#','Player','Elo','W–L','Win %','1st places','Events'],S.list.map((p,i)=>[i+1,pl(p.id),Math.round(p.elo),wl(p),pct(p.w,tot(p)),p.firsts,p.events]),2)}</div>`;

// Trophies: all-time achievements, independent of the selected period
let PT=[];
const pname=p=>p.name||new Date(p.end+'T12:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
function calcPT(){const today=new Date().toISOString().slice(0,10);
 PT=periodList(D).filter(p=>p.end&&p.end<today).map(p=>{const L=derive(D,p).list,mx=Math.max(0,...L.map(x=>x.w));
  return{p,top:L.slice(0,3).map(x=>x.id),win:mx?L.filter(x=>x.w===mx).map(x=>x.id):[]}})}
function trophies(id){if(!D.trophies)return[];const T=[],tier=(i,n)=>i<n/3?'bronze':i<2*n/3?'silver':'gold';
 PT.forEach(({p,top,win})=>{const i=top.indexOf(id),nm=pname(p);
  if(i>=0)T.push({d:p.end,k:'rank',tier:['gold','silver','bronze'][i],g:'#'+(i+1),t:`#${i+1} ${nm}`});
  if(win.includes(id))T.push({d:p.end,k:'most',tier:'gold',g:'#1',t:`Most wins ${nm}`})});
 const ms=(thr,dates,label)=>{let k=-1;thr.forEach((n,i)=>{if(dates.length>=n)k=i});
  if(k>=0)T.push({d:dates[thr[k]-1],k:label[0]=='M'?'match':'event',tier:tier(k,thr.length),g:String(thr[k]),t:`${label} [${thr[k]}]`})};
 ms(D.trophies.matchWinMilestones,SA.matches.filter(m=>(m.result==='p1'&&m.p1===id)||(m.result==='p2'&&m.p2===id)).map(m=>m.date),'Match wins');
 ms(D.trophies.eventWinMilestones,SA.events.filter(e=>e.standings.some(s=>s.p===id&&s.r===1)).map(e=>e.date),'Event wins');
 return T.sort((a,b)=>b.d.localeCompare(a.d))}
// kinds: rank = laurel wreath, most = shield + star, match = fanned cards, event = trophy cup
function medal(k,tier,g){const c=D.trophies.medalColors[tier],l=c.highlight,m=c.base,d=c.shadow,t=c.ink,rb=D.trophies.ribbonColors[k],r1=rb.left,r2=rb.right,id='g'+tier,
 grad=(n,a,b)=>`<linearGradient id="${id}${n}" x1=${a} y1=${a} x2=${b} y2=${b}><stop offset=0 stop-color="${l}" /><stop offset=.5 stop-color="${m}" /><stop offset=1 stop-color="${d}" /></linearGradient>`,
 fo=`fill="url(#${id})" stroke="${d}" stroke-width=1.5`,fi=`fill="url(#${id}r)" stroke="${d}" stroke-width=1`,
 P={most:['M50 42L88 53V88C88 111 70 123 50 131 30 123 12 111 12 88V53Z','M50 50L81 59V88C81 106 66 116 50 123 34 116 19 106 19 88V59Z'],event:['M50 41L88 63V107L50 129 12 107V63Z','M50 49L81 67V103L50 121 19 103V67Z']}[k],
 body=P?`<path d="${P[0]}" ${fo} /><path d="${P[1]}" ${fi} />`:`<circle cx=50 cy=86 r=44 ${fo} /><circle cx=50 cy=86 r=38.5 fill=none stroke="${d}" stroke-width=3 stroke-dasharray="2 3.6" opacity=.7 /><circle cx=50 cy=86 r=32 ${fi} />`,
 txt=(y,sz,c,v)=>`<text x=50 y=${y} text-anchor=middle font-family="Georgia,serif" font-weight=700 font-size=${sz} fill="${c}">${v}</text>`,
 plate=`<rect x=27 y=104 width=46 height=18 rx=5 fill="${d}" stroke="${l}" stroke-width=1.5 />`+txt(117,g.length>3?10:13,l,g),
 card=a=>`<g transform="rotate(${a} 50 100)"><rect x=40 y=66 width=20 height=28 rx=3 fill="${l}" stroke="${t}" stroke-width=2 /><ellipse cx=50 cy=78 rx=5 ry=6.5 fill="${t}" opacity=.55 /></g>`,
 leaf=(f,sg)=>{const x=(50+sg*27*Math.sin(f*Math.PI/180)).toFixed(1),y=(86-27*Math.cos(f*Math.PI/180)).toFixed(1);return`<ellipse cx=${x} cy=${y} rx=6.5 ry=2.8 fill="${t}" opacity=.8 transform="rotate(${sg*f} ${x} ${y})" />`},
 star=[...Array(10)].map((_,i)=>{const a=i*Math.PI/5-Math.PI/2,r=i%2?9:21;return(50+r*Math.cos(a)).toFixed(1)+','+(82+r*Math.sin(a)).toFixed(1)}).join(' '),
 icon={rank:[0,1,2,3,4,5].map(i=>leaf(32+i*27,-1)+leaf(32+i*27,1)).join('')+txt(96,g.length>2?22:30,t,g),
  most:`<polygon points="${star}" fill="${t}" />`+plate,
  match:card(-24)+card(0)+card(24)+plate,
  event:`<path d="M37 60h26v12c0 9-5.5 15-13 15s-13-6-13-15z" fill="${t}" /><path d="M37 64c-8 0-9 10 0 12M63 64c8 0 9 10 0 12" fill=none stroke="${t}" stroke-width=3 /><rect x=47 y=87 width=6 height=7 fill="${t}" /><rect x=40 y=94 width=20 height=5 rx=2 fill="${t}" />`+plate}[k];
 return `<svg viewBox="0 0 100 134" width=100 height=134 aria-hidden=true><defs>${grad('',0,1)}${grad('r',1,0)}</defs><path d="M27 0h18l11 52H38z" fill="${r1}" /><path d="M73 0H55L44 52h18z" fill="${r2}" /><path d="M33 0l10 52M67 0L57 52" stroke="#fff" stroke-opacity=.35 stroke-width=2 fill=none />${body}${icon}<ellipse cx=36 cy=62 rx=15 ry=7 fill="#fff" opacity=.2 transform="rotate(-30 36 62)" /></svg>`}
const trophyCard=id=>{const T=trophies(id);return T.length?`<details class=card open><summary>Trophies</summary><div class=tro>${T.map(t=>`<div class=trophy>${medal(t.k,t.tier,t.g)}<div class=tname>${esc(t.t)}</div><div class=tdate>${t.d.split('-').reverse().join('.')}</div></div>`).join('')}</div></details>`:''};

function player(id){const p=S.P[id];if(!p)return'Unknown player';
 const st=(v,k)=>`<div><b>${v}</b><small>${k}</small></div>`;
 const card=(q,X,all)=>`<div class="card stats"><div><span class=big>${Math.round(q.elo)}</span><small>${X.list.includes(q)?`${all?'All-time Elo':'Elo'}, rank ${X.list.indexOf(q)+1} of ${X.list.length}`:all?'No events yet':'No events in this period'}</small></div>${st(wl(q),'wins–losses')}${st(q.dl,'double losses')}${st(q.byes,'byes')}${st(pct(q.w,tot(q)),'win rate')}${st(q.firsts,'1st places')}${st(q.events,'events')}</div>`;
 const h2h=Object.entries(p.h2h).sort((a,b)=>S.P[a[0]].name.localeCompare(S.P[b[0]].name)).map(([o,h])=>[pl(o),h.w,h.l,h.dl,pct(h.w,tot(h))]);
 const em=Object.fromEntries(D.events.map(e=>[e.id,e])),
  hist=S.matches.filter(m=>m.p1===id||m.p2===id).reverse().map(m=>{const o=m.p1===id?m.p2:m.p1,r=m.result;
   return[m.date,o==null?byep():pl(o),r==='bye'?'Bye':r==='dl'?'Double loss':(r==='p1')===(m.p1===id)?'<span class=win>Win</span>':'Loss',`${evl(em[m.event])} <small>round ${m.round}</small>`]});
 const evs=S.events.filter(e=>e.standings.some(s=>s.p==id)).reverse().map(e=>{const s=e.standings.find(s=>s.p==id);return[e.date,evl(e),s.r,S.pts[e.id][id]]});
 return sel()+`<div class=hero>${av(p)}<div class=who><h2><span>${esc(p.name)}${p.nickname?`<small style="display:block">aka ${esc(p.nickname)}</small>`:''}</span></h2><div class=panels>${PER==='all'?'':card(p,S,0)}${card(SA.P[id],SA,1)}</div></div></div>
 ${trophyCard(id)}<details class="card h2h"><summary>Head to head</summary>${tbl(['Opponent','W','L','Double loss','Win %'],h2h)}</details>
 <details class=card><summary>Events</summary>${tbl(['Date','Event','Place','Pts'],evs,2)}</details>
 <details class=card><summary>Match History</summary>${tbl(['Date','Opponent','Result','Event'],hist,4)}</details>`}

const events=()=>`<div class=card>${tbl(['Date','Event','Players','Winner'],[...D.events].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>{const w=e.standings.find(s=>s.r===1);return[e.date,evl(e),e.standings.length,w?plr(w.p):'']}),2)}</div>`;

const mr=m=>m.result==='bye'?`<span class="l win">${pl(m.p1)}</span><span>vs</span><span class=r>${byep(true)}</span>`:`<span class="l ${m.result=='p1'?'win':''}">${pl(m.p1)}</span><span>vs</span><span class="r ${m.result=='p2'?'win':''}">${plr(m.p2)}</span>${m.result=='dl'?'<i>double loss</i>':''}`;
function event(id){const e=D.events.find(e=>e.id===id);if(!e)return'Unknown event';
 const st=(v,k)=>`<div><b>${v}</b><small>${k}</small></div>`;
 return `<div class=card><h2>${esc(evName(e))}${e.rated===false?'<small>unrated</small>':''}</h2><div class=stats>${st(e.standings.length,'players')}${st(e.rounds.length,'rounds')}${st(new Date(e.date+'T12:00').toLocaleDateString(undefined,{dateStyle:'long'}),'date')}${st(periodFor(D,e.date)?periodLabel(periodFor(D,e.date)):'None','ranking period')}</div></div><div class=card><h3>Final standings</h3>${tbl(['#','Player','Pts'],[...e.standings].sort((a,b)=>a.r-b.r).map(s=>[s.r,pl(s.p),SA.pts[e.id][s.p]]),2)}</div>`+
 e.rounds.map((rd,i)=>`<details class=card><summary>Round ${i+1} <small>${esc(rd.phase||'')}</small></summary>${rd.matches.map(m=>`<div class=m>${mr(m)}</div>`).join('')}</details>`).join('')}

function view(){const[,pg,id]=location.hash.split('/');
 $('#app').innerHTML=pg==='player'?player(+id):pg==='event'?event(decodeURIComponent(id)):pg==='events'?events():board();scrollTo(0,0)}
loadData().then(d=>{D=d;SA=derive(d);calcPT();const ps=periodList(d);PER=ps.length?ps[0].start:'all';calc();view()}).catch(e=>$('#app').textContent='Could not load data/bundle.json ('+e.message+'). Serve the folder over HTTP rather than opening the file directly.');
addEventListener('hashchange',()=>D&&view());
document.addEventListener('change',e=>{if(e.target.id==='per'){const o=[...document.querySelectorAll('#app details')].map(d=>d.open);PER=e.target.value;calc();view();document.querySelectorAll('#app details').forEach((d,i)=>d.open=!!o[i])}});
</script></body></html>
