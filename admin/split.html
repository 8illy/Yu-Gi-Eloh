<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Split old bundle</title><link rel=stylesheet href=../style.css></head><body>
<header><b>Admin</b><nav><a href="index.html">Add event</a><a href="../">Back to site</a></nav></header>
<main><div class=card><h3>Split an old bundle.json</h3>
<p>Choose your existing bundle.json. This gives you config.json (settings and trophies) and data.json (periods, players, events). Upload both into the site's data folder, then delete bundle.json.</p>
<input type=file accept=".json" id=f><div id=out></div></div></main>
<script src=../lib.js></script>
<script>
f.onchange=async e=>{const b=JSON.parse(await e.target.files[0].text()),cfg={};
 ['settings','trophies'].forEach(k=>{if(b[k])cfg[k]=b[k]});
 out.innerHTML='<div class=row><button id=c>Download config.json</button><button id=d>Download data.json</button></div>';
 c.onclick=()=>download(JSON.stringify(cfg,null,1)+'\n','config.json');d.onclick=()=>download(fmt(b),'data.json')}
</script></body></html>
