<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Admin: ranking periods</title><link rel=stylesheet href=../style.css></head><body>
<header><b>Admin</b><nav><a href="index.html">Add event</a><a href="events.html">Edit events</a><a href="players.html">Edit players</a><a href="periods.html">Periods</a><a href="../">Back to site</a></nav></header>
<main><div id=app>Loading…</div></main>
<script src=../lib.js></script><script src=work.js></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let D;
function render(){
 $('#app').innerHTML=`<div class=card>${D.periods.map((p,i)=>`<div class=row><input data-k="${i}.name" value="${esc(p.name)}" placeholder="Name (optional)"><label>Start <input type=date data-k="${i}.start" value="${esc(p.start)}"></label><label>End (empty = ongoing) <input type=date data-k="${i}.end" value="${esc(p.end)}"></label><button data-a="rm${i}">Remove</button></div>`).join('')||'<p>No periods yet.</p>'}<button data-a=add>Add period</button><p><small>Dates are inclusive. Periods can't overlap, and only the latest one can be ongoing.</small></p></div><div class=card id=status></div>`;
 status()}
function errors(){const e=[],ps=D.periods;
 ps.forEach((p,i)=>{const n=`Period ${i+1}: `;
  if(!p.start)e.push(n+'choose a start date');
  else if(p.end&&p.end<p.start)e.push(n+'the end is before the start')});
 const s=ps.filter(p=>p.start).sort((a,b)=>a.start.localeCompare(b.start));
 for(let i=1;i<s.length;i++)if(!s[i-1].end||s[i-1].end>=s[i].start)e.push(`${periodLabel(s[i-1])} overlaps ${periodLabel(s[i])}`);
 return e}
function status(){saveWork(D);const errs=errors(),out=errs.length?0:D.events.filter(e=>!D.periods.some(p=>inPeriod(p,e.date))).length;
 $('#status').innerHTML=(errs.length?errs.map(e=>`<div class=err>${esc(e)}</div>`).join(''):'<div class=win>Ready to export</div>')+(out?`<div>${out} event${out>1?'s':''} fall outside every period and won't count towards any ranking.</div>`:'')+`<div class=row><button data-a=ex ${errs.length?'disabled':''}>Export bundle.json</button></div><small>Upload the downloaded bundle.json over data/bundle.json on your server.</small>`}
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.k;if(!k)return;const[i,f]=k.split('.');
 D.periods[i][f]=f==='start'?t.value:(t.value.trim()||undefined);status()});
document.addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;
 if(a=='add'){D.periods.push({start:''});render()}
 else if(a.startsWith('rm')){D.periods.splice(+a.slice(2),1);render()}
 else if(a=='ex'){D.periods.sort((x,y)=>x.start.localeCompare(y.start));download(fmt(D));render()}});
loadWork().then(d=>{D=d;render()}).catch(e=>$('#app').textContent='Could not load ../data/bundle.json ('+e.message+'). Serve the folder over HTTP.');
</script></body></html>
